name: Chimera Quantum Core

on:
  push:
    branches:
      - chimera-quantum-execution-v1
    paths:
      - 'chimera_quantum/**'
      - 'tests/test_chimera_*.py'
      - 'tests/test_smmq_*.py'
      - 'tests/test_braket_config.py'
      - 'tests/fixtures/smmq-*.json'
      - 'requirements-chimera-quantum.txt'
      - 'requirements-braket.txt'
      - 'run_braket_job.py'
      - 'run_smmq_job.py'
      - 'run_quantum_evidence.py'
      - '.github/workflows/chimera-quantum.yml'
  pull_request:
    paths:
      - 'chimera_quantum/**'
      - 'tests/test_chimera_*.py'
      - 'tests/test_smmq_*.py'
      - 'tests/test_braket_config.py'
      - 'tests/fixtures/smmq-*.json'
      - 'requirements-chimera-quantum.txt'
      - 'requirements-braket.txt'
      - 'run_braket_job.py'
      - 'run_smmq_job.py'
      - 'run_quantum_evidence.py'
      - '.github/workflows/chimera-quantum.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-chimera-quantum.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements-chimera-quantum.txt
      - name: Run quantum-core and backend-contract tests
        run: python -m pytest tests/test_chimera_*.py tests/test_smmq_*.py tests/test_braket_config.py -q
      - name: Run replay demo
        run: python -m chimera_quantum.cli --measure --workspace /tmp/chimera-quantum-demo
      - name: Produce tamper-evident evidence artifact
        run: python run_quantum_evidence.py --out artifacts/chimera-quantum/evidence.json
      - name: Run full signed two-verifier elevator lane
        run: python -m chimera_quantum.elevator --workspace artifacts/chimera-elevator --seed 42
      - name: Verify Braket one-line backend dry run without AWS credentials
        run: BRAKET_BACKEND=sv1 python run_braket_job.py --dry-run
      - name: Validate SMM-Q Braket request without AWS credentials
        run: python run_smmq_job.py --request tests/fixtures/smmq-request-v1.json --backend sv1 --dry-run --out /tmp/smmq-dry-run.json
      - name: Upload quantum evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera-quantum-evidence
          path: artifacts/chimera-quantum/evidence.json
      - name: Upload signed elevator certificate bundle
        uses: actions/upload-artifact@v4
        with:
          name: chimera-quantum-elevator
          path: |
            artifacts/chimera-elevator/evidence.json
            artifacts/chimera-elevator/execution-receipt.json
            artifacts/chimera-elevator/omega-envelope.json
            artifacts/chimera-elevator/assurance-package.json
            artifacts/chimera-elevator/verifier-a.json
            artifacts/chimera-elevator/verifier-b.json
            artifacts/chimera-elevator/final-certificate.json

  braket-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-chimera-quantum.txt
            requirements-braket.txt
      - name: Install core and Braket dependencies
        run: python -m pip install -r requirements-chimera-quantum.txt -r requirements-braket.txt
      - name: Execute SMM-Q fixture on Amazon Braket LocalSimulator
        run: >-
          python run_smmq_job.py
          --request tests/fixtures/smmq-request-v1.json
          --backend local
          --identity-key /tmp/smmq-executor.key
          --out /tmp/smmq-receipt.json
      - name: Verify signed bridge receipt
        run: |
          python - <<'PY'
          import json
          from chimera_quantum.smmq import verify_signed_smmq_receipt
          receipt = json.load(open('/tmp/smmq-receipt.json', encoding='utf-8'))
          result = verify_signed_smmq_receipt(receipt)
          assert result['valid'], result
          assert receipt['execution_class'] == 'embedded-simulator'
          assert receipt['shots'] == 64
          assert receipt['qpu_execution_claimed'] is False
          print(receipt['receipt_sha256'])
          PY
      - name: Upload SMM-Q signed local receipt
        uses: actions/upload-artifact@v4
        with:
          name: smmq-braket-local-receipt
          path: /tmp/smmq-receipt.json
