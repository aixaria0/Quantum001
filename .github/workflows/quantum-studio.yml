name: Quantum Studio

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/quantum-studio.yml'
  push:
    paths:
      - 'website/**'
      - '.github/workflows/quantum-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Numerical engine and static integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify algorithms, sampling, training and evidence
        run: npm --prefix website test
      - name: Check syntax and self-hosted assets
        run: npm --prefix website run check

  deploy:
    name: Publish public GitHub Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://aixaria0.github.io/Quantum001/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update the generated gh-pages branch
        env:
          PAGES_DIR: ${{ runner.temp }}/quantum001-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$PAGES_DIR" origin/gh-pages
          rsync -a --delete --exclude=.git website/dist/ "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"
          git -C "$PAGES_DIR" config user.name 'github-actions[bot]'
          git -C "$PAGES_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PAGES_DIR" add --all
          if ! git -C "$PAGES_DIR" diff --cached --quiet; then
            git -C "$PAGES_DIR" commit -m "Publish Quantum Studio $GITHUB_SHA"
            git -C "$PAGES_DIR" push origin HEAD:gh-pages
          fi
      - name: Request the public Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
