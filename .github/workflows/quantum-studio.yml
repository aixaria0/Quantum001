name: Quantum Studio

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/quantum-studio.yml'
  push:
    paths:
      - 'website/**'
      - '.github/workflows/quantum-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Numerical engine and static integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify algorithms, sampling, training and evidence
        run: npm --prefix website test
      - name: Check syntax and self-hosted assets
        run: npm --prefix website run check

  deploy:
    name: Publish public GitHub Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the standalone studio
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
